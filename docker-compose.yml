version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: wslp_postgres
    restart: always
    environment:
      POSTGRES_USER: wslp_user
      POSTGRES_PASSWORD: wslp_pass
      POSTGRES_DB: wslp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: wslp_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  grafana:
    image: grafana/grafana
    container_name: wslp_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  miniodata:
  grafanadata: